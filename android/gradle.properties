org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# 19.08.2026 - "Play Store için Release AAB derle" adımı exit code 143
# ("The operation was canceled.") ile kesiliyordu. Bu, minifyEnabled +
# shrinkResources (R8) release derlemesinin GitHub Actions'ın ücretsiz
# runner'ında belleği taşırıp process'in OS tarafından öldürülmesiydi
# (OOM kill), bir kod/sürüm hatası değil. Aşağıdaki ayarlar bellek
# tepe kullanımını düşürür:
# - Gradle JVM heap 4G+2G(metaspace)=6G'den 3G+1G=4G'ye indirildi.
# - Paralel proje derlemesi kapatıldı: aynı anda birden fazla JVM
#   (Gradle worker + Kotlin daemon + R8) çalışıp belleği paylaşmasın.
# - Worker sayısı 2 ile sınırlandı.
# - R8 "full mode" kapatıldı: tam program optimizasyonu belleği en çok
#   tüketen kısımdır; kapatmak biraz daha büyük ama güvenilir bir APK/AAB
#   üretir.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
android.enableR8.fullMode=false
