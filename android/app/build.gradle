plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // google-services.json burada (android/app/) bulunduğu için bu eklenti
    // artık build kırılmadan çalışır (bkz. FIREBASE_SETUP.md).
    id "com.google.gms.google-services"
    // 30.08.2026 eklendi — Crashlytics mapping dosyası yükleme eklentisi
    // (bkz. android/build.gradle > classpath açıklaması).
    id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

// Release imzalama bilgileri: key.properties dosyasından okunur.
// Bu dosya repoya EKLENMEZ (.gitignore'da). GitHub Actions içinde
// workflow tarafından secrets kullanılarak otomatik oluşturulur.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

// GÜVENLİK (20.09.2026 eklendi — düşük öncelik) — bkz. buildTypes.release
// içindeki signingConfig yorumu: key.properties yoksa debug anahtarına
// SESSİZCE düşmek yerine, bu AÇIKÇA istenmedikçe build başarısız olur.
def allowDebugReleaseSigning =
    (project.hasProperty('allowDebugRelease') && project.property('allowDebugRelease').toString() == 'true') ||
    System.getenv('ALLOW_DEBUG_RELEASE_SIGNING') == '1'

// DÜZELTME (24.09.2026): Gradle, hangi task çalıştırılırsa çalıştırılsın
// TÜM buildType bloklarını (release dahil) configuration aşamasında
// değerlendirir. Yani sadece "flutter build apk --debug" çalıştırsanız
// bile release{} bloğu içindeki signingConfig satırı hemen çalışıyordu —
// bu yüzden key.properties yokken DEBUG derlemesi bile "key.properties
// bulunamadı" hatasıyla çöküyordu. Çözüm: bu kontrolü sadece gerçekten
// bir release task'ı istenmişse (assembleRelease, bundleRelease vb.)
// zorunlu kıl; debug (veya başka) task'lar için sessizce debug
// signingConfig'ine düş (release APK'sı zaten üretilmediği için bunun
// bir güvenlik etkisi yoktur).
def isReleaseTaskRequested =
    gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }

def signingConfigMustHaveKeystore() {
    throw new GradleException(
        "key.properties bulunamadı ve debug imzaya düşmek için izin verilmedi. " +
        "Gerçek bir release imzalamak için key.properties ekle, ya da BİLEREK " +
        "debug anahtarıyla yerel test derlemesi yapmak için: " +
        "./gradlew assembleRelease -PallowDebugRelease=true " +
        "(ya da ALLOW_DEBUG_RELEASE_SIGNING=1 ortam değişkeni)."
    )
}

android {
    namespace "com.sitora.ai"
    // 2026 Temmuz itibarıyla en güncel Android sürümüyle (Android 16 / API 36)
    // derleme yapılabilmesi için sabit olarak ayarlandı.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // flutter_local_notifications core library desugaring gerektiriyor.
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.sitora.ai"
        // Android 7.0 (Nougat, API 24) ve üzeri cihazları destekler.
        minSdk = 24
        targetSdk = 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // GÜVENLİK (20.09.2026 düzeltildi — düşük öncelik, "keystore
            // yoksa release sessizce debug imzaya düşüyor"): ESKİDEN
            // key.properties eksikse (ör. CI'da secret'lar yanlış
            // yapılandırılmışsa/hiç enjekte edilmemişse) build SESSİZCE
            // herkesçe bilinen debug anahtarıyla imzalanmış bir "release"
            // APK'sı üretiyordu — bu APK gerçek bir release gibi görünür
            // (minify/shrink açık) ama debug anahtarıyla imzalı olduğundan
            // KOLAYCA yeniden imzalanıp değiştirilebilir, ve yanlışlıkla
            // dağıtılırsa (ör. bir CI artifact'i olarak) gerçek bir release
            // sanılıp yayılabilirdi. Artık debug anahtarına düşmek için
            // AÇIKÇA bir opt-in gerekiyor (-PallowDebugRelease=true ya da
            // ALLOW_DEBUG_RELEASE_SIGNING=1 ortam değişkeni) — bu olmadan
            // key.properties eksikse build BAŞARISIZ olur, sessizce yanlış
            // anahtarla imzalamaz. Yerel hızlı test derlemeleri için:
            //   ./gradlew assembleRelease -PallowDebugRelease=true
            signingConfig hasKeystore
                ? signingConfigs.release
                : ((allowDebugReleaseSigning || !isReleaseTaskRequested)
                    ? signingConfigs.debug
                    : signingConfigMustHaveKeystore())
            // Kod küçültme (R8) burada AÇIK. proguard-rules.pro içinde
            // Gson/flutter_local_notifications için gerekli "keep" kuralları
            // var — bunlar olmadan release derlemede planlanmış bildirimler
            // "Missing type parameter" hatasıyla çöküyordu (indirme sonrası
            // hatırlatma bildirimi kurulurken). Kuralları KALDIRMAYIN.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    // 29.08.2026 kaldırıldı — Appodeal Mobile Ads SDK ve tüm ağ adaptörleri
    // (uygulama reklamsız modele geçti, bkz. FIREBASE_SETUP.md/proje
    // notları). android/build.gradle'daki Appodeal maven repo satırı da
    // aynı gerekçeyle kaldırıldı.
}
