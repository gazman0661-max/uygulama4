buildscript {
    // 19.08.2026 - Gerçek CI hata loguna göre düzeltildi:
    // "Your project's Kotlin version (2.1.20) is lower than Flutter's
    // minimum supported version of 2.2.20." hatası build'i kırıyordu.
    // Kotlin 2.2.20'ye yükseltildi. Bu sürüm Gradle 7.6.3-8.14 aralığıyla
    // tam uyumlu (Kotlin'in resmi belgelerinde doğrulandı), yani mevcut
    // Gradle 8.14.5 ile sorun çıkarmaz.
    //
    // AGP kasıtlı olarak 8.13.2'de bırakıldı, 9.x'e YÜKSELTİLMEDİ.
    // Loglarda görülen "Starting AGP 9+, only the new DSL interface will
    // be read" uyarısı AGP 9 geçişiyle ilgili; bu proje hâlâ eski
    // "kotlin-android" (KGP) eklentisini kullanıyor ve AGP 9'a geçiş
    // şu an ekstra DSL değişiklikleri gerektirir. AGP 8.13.2'de kalmak
    // bu ek karmaşayı ve riski tamamen ortadan kaldırıyor.
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // Google ile giriş için: google-services.json'daki config değerlerini
        // (API key, OAuth client ID'leri) uygulamaya bağlayan Gradle eklentisi.
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Bazı eski/bakımı bırakılmış paketler AGP 8+ ile gerekli olan
// "namespace" alanını kendi android/build.gradle dosyalarında
// tanımlamıyor ve bu "Namespace not specified" derleme hatasına yol
// açıyor. Bu blok, namespace'i olmayan tüm alt projelere
// AndroidManifest.xml'deki paket adından otomatik bir namespace atar,
// böylece hangi paketin eksik olduğunu tek tek bulmak gerekmez.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            def androidExt = project.extensions.findByName('android')
            if (androidExt != null && androidExt.namespace == null) {
                def manifestFile = project.file('src/main/AndroidManifest.xml')
                if (manifestFile.exists()) {
                    def doc = javax.xml.parsers.DocumentBuilderFactory.newInstance()
                        .newDocumentBuilder().parse(manifestFile)
                    def packageName = doc.documentElement.getAttribute('package')
                    if (packageName) {
                        androidExt.namespace = packageName
                    }
                }
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
