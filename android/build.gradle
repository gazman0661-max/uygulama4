buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // STABİL SÜRÜME DÜŞÜRÜLDÜ (2026-08-19) — bkz. settings.gradle'daki not.
        // AGP 8.13.0: API 36 destekli son 8.x sürüm, AGP 9'un built-in Kotlin
        // zorunluluğu yok, CI cache'i sıcak.
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // Google ile giriş için: google-services.json'daki config değerlerini
        // (API key, OAuth client ID'leri) uygulamaya bağlayan Gradle eklentisi.
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Bazı eski/bakımı bırakılmış paketler AGP 8+ ile gerekli olan
// "namespace" alanını kendi android/build.gradle dosyalarında
// tanımlamıyor ve bu "Namespace not specified" derleme hatasına yol
// açıyor. Bu blok, namespace'i olmayan tüm alt projelere
// AndroidManifest.xml'deki paket adından otomatik bir namespace atar,
// böylece hangi paketin eksik olduğunu tek tek bulmak gerekmez.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            def androidExt = project.extensions.findByName('android')
            if (androidExt != null && androidExt.namespace == null) {
                def manifestFile = project.file('src/main/AndroidManifest.xml')
                if (manifestFile.exists()) {
                    def doc = javax.xml.parsers.DocumentBuilderFactory.newInstance()
                        .newDocumentBuilder().parse(manifestFile)
                    def packageName = doc.documentElement.getAttribute('package')
                    if (packageName) {
                        androidExt.namespace = packageName
                    }
                }
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
