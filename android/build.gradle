buildscript {
    // NOT: Önceki denemede AGP 9.3.0 + Kotlin 2.4.0, sonra hatalı biçimde
    // var olmayan bir sürüm olan AGP "8.10.2" kullanılmıştı (CI hatası:
    // "Plugin ... version 8.10.2 was not found"). Bu sefer Google'ın resmi
    // Maven deposunda (maven.google.com / mvnrepository.com) GERÇEKTEN
    // yayınlanmış olduğu tek tek doğrulanan sürümler kullanıldı:
    // - AGP 8.11.2 (Google Maven'da mevcut, yayın: Eylül 2025)
    // - Bu AGP sürümünün resmi minimum/varsayılan Gradle gereksinimi: 8.13
    // - Kotlin 2.1.20 (AGP 8.11 hattının kendi resmi release notlarında
    //   "Update Kotlin dependencies to version 2.1.20" olarak geçiyor)
    // Bu üçlü hem gerçek/indirilebilir hem de compileSdk/targetSdk 36'yı
    // (Play Store'un Ağustos 2026 zorunluluğu) tam destekliyor.
    ext.kotlin_version = '2.1.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // Google ile giriş için: google-services.json'daki config değerlerini
        // (API key, OAuth client ID'leri) uygulamaya bağlayan Gradle eklentisi.
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Bazı eski/bakımı bırakılmış paketler AGP 8+ ile gerekli olan
// "namespace" alanını kendi android/build.gradle dosyalarında
// tanımlamıyor ve bu "Namespace not specified" derleme hatasına yol
// açıyor. Bu blok, namespace'i olmayan tüm alt projelere
// AndroidManifest.xml'deki paket adından otomatik bir namespace atar,
// böylece hangi paketin eksik olduğunu tek tek bulmak gerekmez.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            def androidExt = project.extensions.findByName('android')
            if (androidExt != null && androidExt.namespace == null) {
                def manifestFile = project.file('src/main/AndroidManifest.xml')
                if (manifestFile.exists()) {
                    def doc = javax.xml.parsers.DocumentBuilderFactory.newInstance()
                        .newDocumentBuilder().parse(manifestFile)
                    def packageName = doc.documentElement.getAttribute('package')
                    if (packageName) {
                        androidExt.namespace = packageName
                    }
                }
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
