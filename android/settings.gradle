pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // STABİL SÜRÜME DÜŞÜRÜLDÜ (2026-08-19): AGP 9.3.0/Kotlin 2.4.0 çok yeni ve
    // az test edilmiş olduğundan CI'da tekrarlayan (403 + "operation was
    // canceled") sorunlara yol açtı. AGP 8.13, API 36'yı (Android 16,
    // 31 Ağustos 2026 Play Store zorunluluğu) destekleyen SON 8.x sürümü —
    // hem oturmuş/iyi cache'lenmiş hem de AGP 9'un "built-in Kotlin'e geç"
    // zorunluluğunu tetiklemiyor.
    id "com.android.application" version "8.13.0" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ":app"
