name: sitora_ai
description: "Sitora AI - AI destekli site oluşturucu"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  http: ^1.2.1
  image_picker: ^1.1.2
  flutter_highlight: ^0.7.0
  webview_flutter: ^4.8.0
  file_picker: ^8.1.2
  flutter_code_editor: ^0.3.3
  highlight: ^0.7.0
  html: ^0.15.4
  archive: ^3.4.10
  path_provider: ^2.1.3
  share_plus: ^12.0.2
  flutter_svg: ^2.0.10+1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^1.0.8
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
