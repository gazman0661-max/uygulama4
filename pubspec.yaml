name: sitora_ai
description: "MySitora - Web Builder"
publish_to: 'none'
version: 1.2.3+23

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  http: ^1.2.1
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  flutter_highlight: ^0.7.0
  webview_flutter: ^4.8.0
  webview_flutter_android: ^4.0.0
  file_picker: ^10.3.7
  flutter_code_editor: ^0.3.3
  highlight: ^0.7.0
  html: ^0.15.4
  archive: ^3.4.10
  path_provider: ^2.1.3
  share_plus: ^12.0.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0
  qr_flutter: ^4.1.0
  in_app_review: ^2.0.9
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.2.0
  firebase_messaging: ^15.1.6
  firebase_app_check: ^0.3.1
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.0
  app_links: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
