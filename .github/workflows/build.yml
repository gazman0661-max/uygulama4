name: Build Android (Debug APK + Release AAB)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # ---------------------------------------------------------------
      # RELEASE İMZALAMA
      # Play Store'un beklediği "upload key" ile derleme yapabilmek için
      # keystore dosyasını ve key.properties'i GitHub Secrets'tan burada
      # üretiyoruz. Bu ikisi repoya asla commit edilmez.
      #
      # Repo Settings > Secrets and variables > Actions altında kayıtlı
      # secret'lar (senin repondaki isimlerle birebir aynı):
      #   KEYSTORE_BASE64   -> keystore dosyanızın base64 hali
      #   KEYSTORE_PASSWORD -> keystore şifresi
      #   KEY_ALIAS         -> key alias
      #   KEY_PASSWORD      -> key şifresi
      # ---------------------------------------------------------------
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Verify keystore was decoded correctly
        run: |
          if ! keytool -list -keystore android/app/upload-keystore.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" > /dev/null 2>&1; then
            echo "::error::Keystore decode edilemedi veya şifre/alias yanlış. KEYSTORE_BASE64 secret'ının doğru base64 çıktısı olduğundan emin olun (satır sonu/boşluk eklenmemiş olmalı)."
            exit 1
          fi
          echo "Keystore doğrulandı, release imzalama gerçek key ile yapılacak."

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release AAB (Play Store)
        run: flutter build appbundle --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
