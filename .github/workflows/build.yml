name: Build Android (zip)

# Repo kokune Worlds_Merge-vXXX.zip yukle -> otomatik acilir, derlenir.
# Birden fazla zip varsa en yuksek surum numarali olan (sort -V) kullanilir.
on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Repo'yu al
        uses: actions/checkout@v4

      - name: Zip'i bul ve ac
        id: unzip
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(ls -1 *.zip 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "::error::Repo kokunde .zip bulunamadi"
            exit 1
          fi
          echo "Kullanilan zip: $ZIP"
          SRC="$RUNNER_TEMP/src"
          mkdir -p "$SRC"
          unzip -q "$ZIP" -d "$SRC"
          PUB=$(find "$SRC" -maxdepth 3 -name pubspec.yaml | head -n 1)
          if [ -z "$PUB" ]; then
            echo "::error::Zip icinde pubspec.yaml yok"
            exit 1
          fi
          DIR=$(dirname "$PUB")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Proje klasoru: $DIR"
          grep -n '^version:' "$PUB"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Imza (keystore) hazirla
        shell: bash
        working-directory: ${{ steps.unzip.outputs.dir }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "Imza: GitHub Secrets'tan yazildi."
          elif [ -f android/key.properties ]; then
            echo "Imza: zip icindeki android/key.properties kullaniliyor."
          else
            echo "::warning::Keystore yok -> DEBUG imzasi kullanilacak. Bu AAB Play'e yuklenemez."
          fi

      - name: Bagimliliklar
        working-directory: ${{ steps.unzip.outputs.dir }}
        run: flutter pub get

      - name: AAB derle (Play Store)
        working-directory: ${{ steps.unzip.outputs.dir }}
        run: flutter build appbundle --release

      - name: APK derle (telefonda deneme)
        working-directory: ${{ steps.unzip.outputs.dir }}
        run: flutter build apk --release

      - name: AAB yukle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: ${{ steps.unzip.outputs.dir }}/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ steps.unzip.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
